:root {
  --night: #0f0e17; --frame: #1b1926; --ink: #efe8d8; --muted: #a8a095; --line: #4a4560;
  --straw: #e0b25c; --host: #9fb3ee; --note: #8fd19e; --box: #151427; --boxEdge: #d9d2c0;
  --f-px: "PixelTC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", monospace;
  --f-read: "Noto Serif TC", "PMingLiU", serif;
  color-scheme: dark;
}
html, body { background: var(--night); color: var(--ink); }
body { font: 16px/1.6 var(--f-px); -webkit-font-smoothing: none; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--straw); outline-offset: 2px; }
.wrap { max-width: 36rem; margin: 0 auto; padding-inline: 12px; padding-block: 10px 28px; display: grid; gap: 10px; }
.top { display: flex; align-items: baseline; gap: 10px; }
.top h1 { font-size: 18px; font-weight: 400; margin: 0; letter-spacing: .08em; }
.top span { font-size: 12px; color: var(--muted); }

.game { position: relative; background: var(--frame); border: 3px solid #2e2a3e; border-radius: 6px; box-shadow: 0 0 0 3px #0a0910; overflow: hidden; }
.screen { position: relative; aspect-ratio: 4 / 3; background: #000; touch-action: manipulation; }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
.hud { position: absolute; inset: 6px 6px auto 6px; display: flex; gap: 6px; align-items: flex-start; pointer-events: none; }
.goal { font-size: 12px; line-height: 1.5; background: rgba(12,11,22,.78); border: 1px solid var(--line); padding: 2px 7px; border-radius: 3px; max-width: 75%; }
.goal:empty { display: none; }
.goal { white-space: pre-line; flex: 0 1 auto; min-width: 0; }
.hud .mbtn { flex: none; white-space: nowrap; }
.hud .sp { flex: 1; }
.mbtn { pointer-events: auto; font-size: 13px; background: rgba(12,11,22,.85); border: 2px solid var(--boxEdge); color: var(--ink); padding: 1px 9px; border-radius: 3px; cursor: pointer; position: relative; }
.mbtn.off { color: var(--muted); border-color: var(--line); }
.mbtn i { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background: var(--note); border: 1px solid #000; }
.toasts { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; pointer-events: none; width: 92%; }
.toast { font-size: 12px; background: rgba(10,10,20,.9); border: 2px solid var(--note); color: var(--note); padding: 2px 8px; border-radius: 3px; max-width: 100%; text-align: center; }
.toast.item { border-color: var(--straw); color: var(--straw); }
.toast.place { border-color: var(--boxEdge); color: var(--ink); font-size: 15px; padding: 3px 14px; letter-spacing: .15em; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: tin .25s ease-out both; } @keyframes tin { from { opacity: 0; transform: translateY(-4px); } } }
.cover { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; background: #07060c; padding: 16px; }
.cover .n { font-size: 12px; letter-spacing: .4em; color: var(--muted); }
.cover h2 { margin: 0; font-weight: 400; font-size: clamp(28px, 9vw, 40px); letter-spacing: .2em; }
.cover p { margin: 0; color: var(--muted); max-width: 22em; font-size: 14px; }
.silence { background: rgba(4,4,8,.86); }
.silence h2 { font-size: 26px; }
.bar { width: min(14rem, 80%); height: 6px; border: 2px solid var(--boxEdge); background: #000; }
.bar i { display: block; height: 100%; width: 0; background: var(--straw); }
@media (prefers-reduced-motion: no-preference) { .bar i.run { animation: fill var(--dur, 10s) steps(20) forwards; } @keyframes fill { to { width: 100%; } } }
@media (prefers-reduced-motion: reduce) { .bar i.run { width: 100%; } }

.box { height: 12rem; margin: 6px; border: 3px double var(--boxEdge); background: var(--box); border-radius: 4px; padding: 10px 12px; overflow-y: auto; position: relative; }
.dlg { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; min-height: 100%; }
.dlg.nar, .dlg.nopor { grid-template-columns: minmax(0, 1fr); }
.por { width: 48px; height: 48px; border: 2px solid var(--line); background: #2a2740; image-rendering: pixelated; }
.nm { display: inline-block; font-size: 14px; color: var(--straw); margin-bottom: 2px; letter-spacing: .1em; }
.dlg.you .nm { color: #8fd0d4; }
.dlg.host .tx { color: var(--host); }
.dlg.nar .tx { color: #d6cfbf; }
.tx { margin: 0; font-size: 16px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
.more { position: absolute; right: 10px; bottom: 6px; font-size: 12px; color: var(--straw); }
@media (prefers-reduced-motion: no-preference) { .more { animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } } }
.mt { margin: 0 0 6px; font-size: 14px; color: var(--muted); white-space: pre-line; }
.opts { display: grid; gap: 2px; }
.opt { text-align: left; background: none; border: 0; padding: 4px 6px 4px 20px; cursor: pointer; position: relative; line-height: 1.5; border-radius: 2px; }
.opt.sel, .opt:hover { background: #26243d; }
.opt.sel::before { content: "▶"; position: absolute; left: 4px; color: var(--straw); font-size: 11px; top: 7px; }
.opt:disabled { color: #6c6679; cursor: default; }
.opt.pri { color: var(--straw); }
.idle { color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.idle b { color: var(--ink); font-weight: 400; }

.panel { position: absolute; inset: 0; background: rgba(13,12,24,.97); overflow-y: auto; padding: 12px; display: grid; gap: 12px; align-content: start; z-index: 5; }
.panel.homep { background: linear-gradient(to bottom, rgba(13,12,24,.25), rgba(13,12,24,.55) 22%, rgba(13,12,24,.94) 42%); }
.panel h3 { margin: 0; font-size: 20px; font-weight: 400; letter-spacing: .1em; }
.ph { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pbtn { border: 2px solid var(--boxEdge); background: #1e1c30; padding: 4px 12px; border-radius: 3px; cursor: pointer; }
.pbtn.pri { background: var(--straw); color: #1a1420; border-color: var(--straw); }
.pbtn:disabled { opacity: .45; cursor: default; }
.cols { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
.cols section, .card2 { border: 2px solid var(--line); background: #1a1830; padding: 8px 10px; border-radius: 3px; min-width: 0; }
.cols h4 { margin: 0 0 4px; font-size: 13px; color: var(--straw); font-weight: 400; letter-spacing: .1em; }
.cols ul { margin: 0; padding-left: 1.1em; font-size: 14px; display: grid; gap: 3px; }
.small { font-size: 13px; color: var(--muted); }
.letterdoc { background: #efe6cc; color: #2c2217; border: 2px solid #8a7a58; padding: 14px 16px; font-size: 16px; line-height: 1.9; }
.letterdoc p { margin: 0 0 .9em; }
.letterdoc .deep { color: #6b2a1c; }
.itemlist { display: grid; gap: 6px; }
.itemlist div { border: 2px solid var(--line); background: #1a1830; padding: 6px 10px; font-size: 14px; border-radius: 3px; }
.itemlist b { display: block; font-weight: 400; color: var(--straw); }
.puz { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.puz .col { display: grid; gap: 6px; align-content: start; }
.puz .col b { font-weight: 400; font-size: 13px; color: var(--muted); }
.doc { background: #e8dfc4; color: #2c2217; padding: 6px; border: 2px solid #8a7a58; display: grid; gap: 5px; }
.doc.arch { background: #dcd9cf; }
.fld { border: 2px solid #b8aa86; background: #f6efdb; color: #2c2217; padding: 6px; text-align: left; cursor: pointer; font-size: 14px; border-radius: 2px; }
.fld.pk { border-color: #c47d1c; background: #ffe4a8; }
.fld.ok { border-color: #3f7d4e; background: #d8ecd5; }
.conv { display: grid; gap: 8px; }
.conv label { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 14px; }

<body>

<div class="wrap">
  <div class="top"><h1>被遺忘的名字</h1><span>Mapawanay a ngangan｜像素版</span></div>
  <div class="game" id="game">
    <div class="screen" id="screen">
      <canvas id="cv" width="192" height="144" aria-label="遊戲畫面"></canvas>
      <div class="hud"><span class="goal" id="goal"></span><span class="sp"></span><button class="mbtn" id="sbtn" aria-pressed="true" title="背景音樂">音樂開</button><button class="mbtn" id="mbtn" hidden>選單</button></div>
      <canvas class="stand" id="stand" width="40" height="48" hidden></canvas>
      <div class="cg" id="cg" hidden><canvas id="cgc" width="96" height="72"></canvas><span id="cgn"></span></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="cover" id="cover" hidden></div>
    </div>
    <div class="box" id="box" aria-live="polite"></div>
    <div class="panel" id="panel" hidden></div>
  </div>
  <p class="help" id="help">點地板走過去，點人或東西就會走過去互動。鍵盤：方向鍵移動，空白鍵說話、翻頁。</p>
  <section class="end" id="end" hidden></section>
</div>

<script>
const X = null;
// ================= 像素美術：地圖、圖塊、角色 =================
const TS = 16, VW = 12, VH = 9;
function hash(x, y, s) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function R(g, c, x, y, w = 1, h = 1) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const PAL = {
  ol: '#1a1420', wallTop: '#2a2331', wallTopHi: '#3a3144',
  plaster: '#b7a88d', plasterDk: '#a29379', plasterLt: '#c4b69b', wains: '#6a4630', wainsDk: '#523522', wainsHi: '#86593b',
  wood: '#8a5a3a', woodDk: '#6c4428', woodHi: '#9f6b47',
  terr: '#8e887b', terrDk: '#7b7569', terrLine: '#a39d8e',
  grass: '#32502c', grassDk: '#284223', grassHi: '#476a36', hedge: '#1f341d', hedgeHi: '#2e4a2a',
  dirt: '#675237', dirtDk: '#54432d', dirtHi: '#7a6444',
  conc: '#838179', concDk: '#716f68', patch: '#a3a095', porch: '#6f6c65',
  roof: '#5b6771', roofDk: '#48535c', roofHi: '#76838d', rust: '#86563a',
  ext: '#a69779', extDk: '#8f8166', warm: '#f0c46a', warmHi: '#fde2a0'
};

// ---------- 地圖 ----------
const MAPS = {
  room: { w: 12, h: 9, rows: [
    '############',
    '#==wW==c==K#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........k',
    '#..........#',
    '#..........#',
    '#####DD#####'] },
  hall: { w: 12, h: 9, rows: [
    '############',
    '#=d==wW==t=#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#####DD#####'] },
  out: { w: 20, h: 14, rows: [
    'TTTTTTTTTTTTTTTTTTTT',
    'TggggtgggPPPgggtgggT',
    'TgggggggcPPPcggggggT',
    'TgggRRRRRRRRRRRRRggT',
    'TkkkRRRRRRRRRRRRRggT',
    'TskkRRRRRRRRRRRRRggT',
    'TkkkRRRRRRRRRRRRRggT',
    'TkkkHHwHHHDHHwHHHggT',
    'TggeeeeeeeeeeeeeeggT',
    'Tgg..............ggT',
    'Tgb..............ggT',
    'Tggg.....ggg.....ggT',
    'Tgggg...ggggg...gggT',
    'TTTTTTTTTEETTTTTTTTT'] }
};
for (const k in MAPS) MAPS[k].rows.forEach((r, i) => { if (r.length !== MAPS[k].w) console.warn('map row', k, i, r.length); });

const SOLID = { room: '#=wWcKk', hall: '#=wWt', out: 'TtRHwsb' };
// 門：走進去會觸發
const DOORS = {
  room: { '5,8': 'down', '6,8': 'down' },
  hall: { '2,1': 'room', '5,8': 'out', '6,8': 'out' },
  out: { '10,7': 'hall', '9,13': 'gate', '10,13': 'gate' }
};

function tileAt(m, x, y) { const M = MAPS[m]; if (x < 0 || y < 0 || x >= M.w || y >= M.h) return '#'; return M.rows[y][x]; }

// ---------- 圖塊 ----------
function tFloorWood(g, x, y, tx, ty) {
  for (let r = 0; r < 4; r++) {
    const row = ty * 4 + r, shade = hash(0, row, 30) > .5 ? PAL.wood : '#825436';
    R(g, shade, x, y + r * 4, 16, 4); R(g, PAL.woodDk, x, y + r * 4 + 3, 16, 1);
    if (hash(tx, row, 1) > .72) { const sx = Math.floor(hash(tx, row, 31) * 15); R(g, PAL.woodDk, x + sx, y + r * 4, 1, 3); }
    if (hash(tx, row, 2) > .8) R(g, PAL.woodHi, x + Math.floor(hash(row, tx, 32) * 12), y + r * 4 + 1, 4, 1);
    if (hash(tx, row, 33) > .93) R(g, '#5e3a23', x + 3 + Math.floor(hash(tx, row, 34) * 10), y + r * 4 + 1, 2, 1);
  }
}
function tTerr(g, x, y, tx, ty) {
  R(g, PAL.terr, x, y, 16, 16);
  const cols = ['#a39c8e', '#6d685e', '#b4a78e', '#5f6b69', '#9a8f7c'];
  for (let i = 0; i < 22; i++) R(g, cols[Math.floor(hash(tx * 31 + i, ty, 3) * cols.length)], x + Math.floor(hash(tx, ty * 29 + i, 4) * 16), y + Math.floor(hash(tx + i, ty, 5) * 16));
  if (tx % 3 === 0) R(g, PAL.terrLine, x, y, 1, 16);
  if (ty % 3 === 0) R(g, PAL.terrLine, x, y, 16, 1);
}
function tWallTop(g, x, y, tx, ty) { R(g, PAL.wallTop, x, y, 16, 16); if (hash(tx, ty, 6) > .5) R(g, PAL.wallTopHi, x + 3, y + 5, 2, 1); }
function tWallFace(g, x, y, tx, ty) {
  R(g, PAL.plaster, x, y, 16, 10); R(g, PAL.plasterDk, x, y, 16, 2);
  for (let i = 0; i < 5; i++) R(g, hash(tx, i, 7) > .5 ? PAL.plasterDk : PAL.plasterLt, x + Math.floor(hash(tx, ty + i, 8) * 16), y + 2 + Math.floor(hash(tx + i, ty, 9) * 7));
  if (hash(tx, ty, 10) > .75) { const cx = x + 4 + Math.floor(hash(tx, 1, 11) * 8); R(g, PAL.plasterDk, cx, y + 3, 1, 2); R(g, PAL.plasterDk, cx + 1, y + 5, 1, 2); R(g, PAL.plasterDk, cx, y + 7, 1, 1); }
  R(g, PAL.wainsHi, x, y + 10, 16, 1); R(g, PAL.wains, x, y + 11, 16, 5);
  for (let i = 0; i < 16; i += 4) R(g, PAL.wainsDk, x + i, y + 11, 1, 5);
}
function tWindow(g, x, y, tx, ty, left, sky) {
  tWallFace(g, x, y, tx, ty);
  const x0 = left ? x + 3 : x, w = 13;
  R(g, PAL.woodDk, x0, y + 1, w, 9);
  const grad = sky === 'dusk' ? ['#3a3f78', '#6a4a7a', '#b8604e', '#d98a52'] : ['#141b3a', '#1a2448', '#1f2c55', '#243260'];
  for (let i = 0; i < 4; i++) R(g, grad[i], left ? x0 + 1 : x0, y + 2 + i * 2, w - 1, 2);
  R(g, PAL.woodDk, left ? x0 + 7 : x0 + 5, y + 1, 1, 9); R(g, PAL.woodDk, x0, y + 5, w, 1);
  if (sky !== 'dusk' && !left) { R(g, '#e8e6d0', x0 + 8, y + 3); R(g, '#c9c6b0', x0 + 2, y + 7); }
  R(g, PAL.wainsHi, x0, y + 10, w, 1);
}
function tCalendar(g, x, y, tx, ty) { tWallFace(g, x, y, tx, ty); R(g, '#e9e4d6', x + 5, y + 1, 7, 8); R(g, '#b8333a', x + 5, y + 1, 7, 2); for (let i = 0; i < 3; i++) R(g, '#8a8578', x + 6, y + 4 + i * 2, 5, 1); R(g, '#3a3030', x + 8, y, 1, 1); }
function tClock(g, x, y, tx, ty) { tWallFace(g, x, y, tx, ty); R(g, '#4a3326', x + 4, y + 1, 8, 8); R(g, '#e4dcc4', x + 5, y + 2, 6, 6); R(g, '#2a2020', x + 8, y + 3, 1, 3); R(g, '#2a2020', x + 8, y + 5, 2, 1); }
function tWardrobeWall(g, x, y, tx, ty) { tWallFace(g, x, y, tx, ty); }
function tDoorIn(g, x, y) { R(g, PAL.wains, x + 1, y, 14, 16); R(g, '#1c1520', x + 3, y + 1, 10, 15); R(g, '#2c2230', x + 3, y + 12, 10, 4); R(g, PAL.wainsHi, x + 1, y, 14, 1); }
function tDoorDown(g, x, y, tx) { R(g, '#1b1520', x, y, 16, 16); R(g, PAL.woodDk, x, y, 16, 3); R(g, PAL.woodHi, x, y, 16, 1); }
function tCurtain(g, x, y, tx, ty) { tWallTop(g, x, y, tx, ty); R(g, '#9c3f3a', x + 3, y, 10, 16); for (let i = 0; i < 16; i += 4) { R(g, '#e3c07a', x + 5, y + i + 1); R(g, '#e3c07a', x + 10, y + i + 3); R(g, '#7c2e2c', x + 8, y + i, 1, 4); } }

function tGrass(g, x, y, tx, ty) {
  R(g, PAL.grass, x, y, 16, 16);
  for (let i = 0; i < 10; i++) { const px = Math.floor(hash(tx * 7 + i, ty, 12) * 16), py = Math.floor(hash(tx, ty * 7 + i, 13) * 15); R(g, hash(i, tx, ty) > .5 ? PAL.grassDk : PAL.grassHi, x + px, y + py, 1, 2); }
}
function tTall(g, x, y, tx, ty) { tGrass(g, x, y, tx, ty); for (let i = 0; i < 9; i++) { const px = 1 + Math.floor(hash(tx * 3 + i, ty, 14) * 14); R(g, i % 2 ? '#51753b' : PAL.grassDk, x + px, y + 2 + (i % 3), 1, 12 - (i % 3)); R(g, '#61863f', x + px, y + 2 + (i % 3)); } }
function tHedge(g, x, y, tx, ty) { R(g, PAL.hedge, x, y, 16, 16); for (let i = 0; i < 6; i++) { const px = Math.floor(hash(tx, ty + i, 15) * 12), py = Math.floor(hash(tx + i, ty, 16) * 12); R(g, PAL.hedgeHi, x + px, y + py, 4, 3); R(g, '#3b5c33', x + px + 1, y + py, 2, 1); } }
function tDirt(g, x, y, tx, ty) { R(g, PAL.dirt, x, y, 16, 16); for (let i = 0; i < 7; i++) R(g, hash(i, tx, 17) > .5 ? PAL.dirtDk : PAL.dirtHi, x + Math.floor(hash(tx * 5 + i, ty, 18) * 15), y + Math.floor(hash(tx, ty * 5 + i, 19) * 15), 2, 1); }
function tConc(g, x, y, tx, ty, c = PAL.conc) { R(g, c, x, y, 16, 16); for (let i = 0; i < 6; i++) R(g, PAL.concDk, x + Math.floor(hash(tx + i, ty, 20) * 16), y + Math.floor(hash(tx, ty + i, 21) * 16)); if (hash(tx, ty, 22) > .7) { R(g, PAL.concDk, x + 3, y + 8, 4, 1); R(g, PAL.concDk, x + 7, y + 9, 3, 1); } }
function tPatch(g, x, y, tx, ty) { tConc(g, x, y, tx, ty, PAL.patch); if (hash(tx, ty, 23) > .4) R(g, '#b3b0a4', x + 4, y + 5, 5, 1); }
function tPorch(g, x, y, tx, ty) { tConc(g, x, y, tx, ty, PAL.porch); R(g, 'rgba(0,0,0,.28)', x, y, 16, 4); }
function tRoof(g, x, y, tx, ty) {
  const up = ty <= 4, base = up ? '#6f706b' : '#5c5d59', hi = up ? '#85867f' : '#6f706a', dk = up ? '#5a5b56' : '#4a4b47';
  R(g, base, x, y, 16, 16);
  for (let i = 0; i < 16; i += 4) { R(g, hi, x + i, y, 1, 16); R(g, dk, x + i + 2, y, 1, 16); }
  for (let i = 0; i < 3; i++) if (hash(tx, ty + i, 24) > .55) { const rx = x + Math.floor(hash(tx + i, ty, 25) * 15), ry = y + Math.floor(hash(ty, tx + i, 26) * 8); R(g, PAL.rust, rx, ry, 1, 5 + Math.floor(hash(i, tx, 27) * 6)); R(g, '#9c6a44', rx, ry, 1, 2); }
  if (ty === 3) R(g, '#8f908a', x, y, 16, 2);
  if (ty === 5) { R(g, '#3f403c', x, y, 16, 1); R(g, '#9a9b94', x, y + 1, 16, 2); R(g, '#3f403c', x, y + 3, 16, 1); }
  if (ty === 6) R(g, '#34352f', x, y + 14, 16, 2);
  const tire = hash(tx, ty, 35);
  if (tire > .9 && tx > 4 && tx < 16) { R(g, 'rgba(0,0,0,.3)', x + 4, y + 12, 10, 2); R(g, '#1b1b1b', x + 5, y + 3, 6, 1); R(g, '#1b1b1b', x + 4, y + 4, 8, 7); R(g, '#1b1b1b', x + 5, y + 11, 6, 1); R(g, '#3a3a3a', x + 5, y + 4, 6, 1); R(g, dk, x + 6, y + 6, 4, 3); R(g, '#2a2a2a', x + 6, y + 6, 4, 1); }
  else if (tire > .84) { R(g, '#7a3f2c', x + 5, y + 6, 6, 4); R(g, '#95533a', x + 5, y + 6, 6, 1); }
}
function tExt(g, x, y, tx, ty) { R(g, PAL.ext, x, y, 16, 16); R(g, 'rgba(0,0,0,.35)', x, y, 16, 3); R(g, PAL.extDk, x, y + 12, 16, 4); for (let i = 0; i < 4; i++) R(g, PAL.extDk, x + Math.floor(hash(tx, i, 27) * 16), y + 4 + Math.floor(hash(i, tx, 28) * 7)); }
function tExtWin(g, x, y, tx, ty) { tExt(g, x, y, tx, ty); R(g, PAL.woodDk, x + 2, y + 3, 12, 8); R(g, PAL.warm, x + 3, y + 4, 10, 6); R(g, PAL.warmHi, x + 4, y + 5, 3, 2); R(g, PAL.woodDk, x + 8, y + 3, 1, 8); }
function tExtDoor(g, x, y, tx, ty) { tExt(g, x, y, tx, ty); R(g, PAL.woodDk, x + 2, y + 2, 12, 14); R(g, '#e3a955', x + 3, y + 3, 10, 13); R(g, PAL.wood, x + 3, y + 3, 6, 13); R(g, PAL.warmHi, x + 9, y + 3, 1, 13); }
function tSink(g, x, y, tx, ty) { tConc(g, x, y, tx, ty, PAL.concDk); R(g, '#5f6a70', x + 1, y + 2, 14, 12); R(g, '#39505e', x + 3, y + 4, 10, 8); R(g, '#5a7888', x + 4, y + 5, 4, 1); R(g, '#aab2b6', x + 7, y, 2, 4); }
function tKitch(g, x, y, tx, ty) { tConc(g, x, y, tx, ty, PAL.concDk); }
function tGate(g, x, y, tx, ty) { tDirt(g, x, y, tx, ty); R(g, 'rgba(0,0,0,.25)', x, y + 10, 16, 6); }

const TILE = {
  room: { '#': tWallTop, '=': tWallFace, 'w': (g, x, y, tx, ty) => tWindow(g, x, y, tx, ty, true, 'dusk'), 'W': (g, x, y, tx, ty) => tWindow(g, x, y, tx, ty, false, 'dusk'), 'c': tCalendar, 'K': tWardrobeWall, 'k': tCurtain, '.': tFloorWood, 'D': tDoorDown },
  hall: { '#': tWallTop, '=': tWallFace, 'w': (g, x, y, tx, ty) => tWindow(g, x, y, tx, ty, true, 'night'), 'W': (g, x, y, tx, ty) => tWindow(g, x, y, tx, ty, false, 'night'), 't': tClock, 'd': tDoorIn, '.': tTerr, 'D': tDoorDown },
  out: { 'T': tHedge, 'g': tGrass, 't': tTall, 'P': tPatch, 'c': tConc, 'R': tRoof, 'k': tKitch, 's': tSink, 'H': tExt, 'w': tExtWin, 'D': tExtDoor, 'e': tPorch, '.': tDirt, 'b': tGrass, 'E': tGate }
};
const MAPCACHE = {};
function mapLayer(m) {
  if (MAPCACHE[m]) return MAPCACHE[m];
  const M = MAPS[m], c = mk(M.w * TS, M.h * TS), g = c.getContext('2d');
  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) { const f = TILE[m][M.rows[y][x]] || tFloorWood; f(g, x * TS, y * TS, x, y); }
  return (MAPCACHE[m] = c);
}

// ---------- 家具（畫在角色同一層，依 y 排序） ----------
function fBed(g, x, y, s) {
  R(g, PAL.woodDk, x, y, 32, 30); R(g, PAL.wood, x + 1, y + 1, 30, 28);
  R(g, '#e7e0cc', x + 4, y + 3, 24, 6); R(g, '#cfc6ae', x + 4, y + 8, 24, 1);
  R(g, '#b04a55', x + 2, y + 10, 28, 18);
  for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) { R(g, '#e8cfa0', x + 5 + i * 4 + (j % 2) * 2, y + 13 + j * 5, 2, 2); R(g, '#7fa05a', x + 7 + i * 4 - (j % 2) * 2, y + 14 + j * 5); }
  R(g, 'rgba(0,0,0,.18)', x + 12, y + 10, 10, 3);
  if (s.ch === 1 && !s.done['o_room_phone']) { R(g, '#111', x + 20, y + 15, 5, 8); R(g, '#3d5aa8', x + 21, y + 16, 3, 5); }
}
function fWardrobe(g, x, y) {

function deduce(i, removed) {
  while (i < DEDUCE.length && DEDUCE[i].when && !DEDUCE[i].when(S)) i++;
  if (i >= DEDUCE.length) return end2Close();
  const D = DEDUCE[i], gone = removed || [];
  ask(D.q, D.opts.filter(o => !gone.includes(o[0])).map(([t, ok]) => [t, s => {
    if (ok) { act(`你說：「${t}。」世昌把它寫進去。`); return deduce(i + 1); }
    tick(10); S.flags.dmiss++;
    act(`你說：「${t}。」`);
    say(D.who, D.alt && !S.items.includes('fragment') ? D.alt : D.bad);
    deduce(i, gone.concat([t]));
  }]));
}

    if (e.npc) { let d = e.dir; if (U.talkTo === e.npc && !e.noTurn) { const [ex, ey] = e.tiles[0]; const dx = P.x - ex, dy = P.y - ey; d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 3) : (dy > 0 ? 0 : 1); } drawChar(ctx, e.npc, x, y, d, 0, e.seated); }
    else if (e.draw) e.draw(ctx, x, y);
  }
  // 提示泡泡
  if (!home && canWalk()) for (const it of Z) { const e = it.e; if (e.hint && e.hint()) { const bx = it.x - cx + 9, by = it.y - cy - 12 + (e.seated ? 0 : -2) + (Math.floor(now / 400) % 2 && !RM ? -1 : 0); R(ctx, PAL.ol, bx - 1, by - 1, 11, 7); R(ctx, '#f4efe2', bx, by, 9, 5); R(ctx, '#f4efe2', bx + 2, by + 5, 2, 2); R(ctx, '#3a3040', bx + 2, by + 2); R(ctx, '#3a3040', bx + 4, by + 2); R(ctx, '#3a3040', bx + 6, by + 2); } }
  // 光
  const LS2 = LIGHTS[m](home ? { ch: 2 } : S);
  lg.globalCompositeOperation = 'source-over'; lg.fillStyle = `rgb(${LS2.amb})`; lg.fillRect(0, 0, 192, 144);
  lg.globalCompositeOperation = 'lighter';
  for (const [lx, ly, r, c] of LS2.L) { const gx = lx - cx, gy = ly - cy, gr = lg.createRadialGradient(gx, gy, 0, gx, gy, r); gr.addColorStop(0, `rgba(${c},.75)`); gr.addColorStop(1, 'rgba(0,0,0,0)'); lg.fillStyle = gr; lg.fillRect(gx - r, gy - r, r * 2, r * 2); }
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(light, 0, 0); ctx.globalCompositeOperation = 'source-over';
  if (U.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${U.fade})`; ctx.fillRect(0, 0, 192, 144); }
  // 打字
  if (U.dlg && U.dlg.n < U.dlg.t.length) { U.dlg.n = RM ? U.dlg.t.length : Math.min(U.dlg.t.length, U.dlg.n + 1); if (now - (draw.lt || 0) > 60 || U.dlg.n >= U.dlg.t.length) { draw.lt = now; paintBox(); } }
}

// ---------- 輸入 ----------
cvs.addEventListener('click', ev => {
  if (!S || U.home) return;
  if (U.dlg) return advance();
  if (!canWalk()) return;
  const r = cvs.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * 192, sy = (ev.clientY - r.top) / r.height * 144;
  const M = MAPS[curMap()];
  const ppx = P.x * TS, ppy = P.y * TS;
  let cx = Math.round(Math.max(0, Math.min(M.w * TS - VW * TS, ppx + 8 - VW * TS / 2))), cy = Math.round(Math.max(0, Math.min(M.h * TS - VH * TS, ppy + 8 - VH * TS / 2)));
  const tx = Math.floor((sx + cx) / TS), ty = Math.floor((sy + cy) / TS);
  // 點到高的家具（衣櫃、檳榔樹）上半部也算
  let e = entAt(tx, ty); if (!e) e = entAt(tx, ty + 1);
  if (e && e.act) { const t = e.tiles.find(t => t[0] === tx && (t[1] === ty || t[1] === ty + 1)) || e.tiles[0]; return goTo(t[0], t[1]); }
  goTo(tx, ty);
});
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-adv]')) return advance();
  const o = t.closest('[data-o]'); if (o) return choose(+o.dataset.o);
  if (t.closest('[data-enter]')) return enterCard();
  const h = t.closest('[data-h]'); if (h) return homeAct(h.dataset.h);
  const p = t.closest('[data-p]'); if (p) return panelAct(p.dataset.p);
  const z = t.closest('[data-z]'); if (z) return puzAct(z);
  if (t.closest('[data-install]')) return window.PWA && PWA.install();
  if (t.closest('#sbtn') || t.closest('[data-bgm]')) { BGM.toggle(); return render(); }
  if (t.closest('#mbtn')) { U.panel = 'nb'; S.newFacts = 0; P.path = []; held = null; return render(); }
  if (t.closest('#box') && U.dlg) return advance();
});
function homeAct(a) {
  if (a === 'new') { try { localStorage.removeItem('bwjm.rpg2.game'); } catch (e) {} S = fresh(); Object.assign(U, { home: false, cur: 0, dlg: null, menu: null, panel: null, pendingPanel: null }); setMap('room', 5, 6, 1); window.scrollTo(0, 0); return flow(); }
  if (a === 'resume') { U.home = false; U.cur = S.log.length; syncP(); return flow(); }
}
function panelAct(a) {
  if (a === 'close') { U.panel = null; if (U.dlg) return render(); if (U.afterPanel) { const f = U.afterPanel; U.afterPanel = null; f(); } return flow(); }
  if (a === 'letter') { U.panel = 'letter'; return render(); }
  if (a === 'pause') { U.panel = 'pause'; return render(); }
  if (a === 'home') { U.panel = null; U.home = true; BGM.update(); return render(); }
}
function puzAct(z) {
  const a = z.dataset.z;
  if (a === 'pz') puzPick(z.dataset.s, z.dataset.id);
  if (a === 'conv') { S.puz.a = $('ca').value; S.puz.b = $('cb').value; puzConv(S.puz.a, S.puz.b, false); }
  if (a === 'help') puzConv('', '', true);
  flow();
}
function enterCard() {
  const n = S.card; S.card = null;
  if (n === 1) { S.ch = 1; S.place = 'room'; setMap('room', 5, 6, 1); act('阿公的東西還堆在房間裡。你站在門口，不知道要從哪裡開始。'); act('走過去，看看房間裡的東西。'); }
  if (n === 2) { S.ch = 2; S.log = []; U.cur = 0; S.place = 'map'; S.time = 21 * 60; S.dl = S.time + 50; setMap('hall', 5, 7, 1); act('長輩說分頭整理。大家散進屋子的各個角落。'); act('文彬留在桌邊。你可以去阿公的房間，也可以到屋外找人說話。準備好了，就回來找文彬。'); }
  if (n === 3) { S.ch = 3; S.log = []; U.cur = 0; S.sel = null; setMap('hall', 7, 7, 1); goPlace('hall3'); }
  flow();
}
const KEYD = { ArrowDown: 0, ArrowUp: 1, ArrowRight: 2, ArrowLeft: 3, s: 0, w: 1, d: 2, a: 3 };
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const k = ev.key;
  if (!S || U.home) return;
  if (U.panel && k === 'Escape') { panelAct('close'); ev.preventDefault(); return; }
  if (U.dlg && (k === ' ' || k === 'Enter' || k === 'z')) { advance(); ev.preventDefault(); return; }
  if (S.card && !U.dlg && (k === ' ' || k === 'Enter')) { enterCard(); ev.preventDefault(); return; }
  if (U.menu && !U.panel) {
    const n = U.menu.opts.length;
    if (k === 'ArrowDown' || k === 'ArrowUp') { let i = U.msel; for (let s = 0; s < n; s++) { i = (i + (k === 'ArrowDown' ? 1 : -1) + n) % n; if (!U.menu.opts[i].dis) break; } U.msel = i; paintBox(); ev.preventDefault(); return; }
    if (k === ' ' || k === 'Enter' || k === 'z') { choose(U.msel); ev.preventDefault(); return; }
    if (k === 'Escape' || k === 'x') { const i = U.menu.opts.findIndex(o => /^(離開|返回|先不看)/.test(o.label)); if (i >= 0) choose(i); ev.preventDefault(); return; }
    return;
  }
  if (k in KEYD) { held = KEYD[k]; ev.preventDefault(); return; }
  if ((k === ' ' || k === 'Enter' || k === 'z') && canWalk()) { interactFacing(); ev.preventDefault(); }
});
document.addEventListener('keyup', ev => { if (ev.key in KEYD && held === KEYD[ev.key]) held = null; });
window.addEventListener('blur', () => { held = null; });

// ---------- 開始 ----------
if (S && S.pending) { if (S.cp) { const cp = S.cp; S = cp; S.cp = clone(cp); S.cpCard = S.card; } else S = fresh(); }
if (S && !S.met) { S.met = {}; if (S.ch > 1 || S.place === 'hall1') { ['mingde', 'yuzhen', 'shichang', 'jianhe', 'wenbin'].forEach(w => S.met[w] = 1); S.flags.round = 1; } }
if (S && S.ch === 2 && S.flags.end2 && !S.card) endChapter(3);
if (S) { U.cur = S.log.length; if (!S.rpg) S.rpg = { map: 'room', x: 5, y: 6, dir: 1 }; syncP(); }
document.fonts && document.fonts.load('16px PixelTC').then(render, render);
render();
requestAnimationFrame(loop);
BGM.arm();
// ---------- 網頁版／App 安裝（只在網頁版打包時加入） ----------
window.PWA = (() => {
  let deferred = null;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; render(); });
  addEventListener('appinstalled', () => { deferred = null; render(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  return {
    canInstall: () => !standalone() && !!deferred,
    iosHint: () => !standalone() && ios,
    async install() { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; render(); }
  };
})();
render();

</script>
